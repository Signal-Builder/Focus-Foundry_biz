<script>
/* ===== Full-screen embers (robust + visible) ========================== */
(() => {
  const canvas = document.getElementById('bg');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  if (!ctx) return;

  const SETTINGS = {
    countBase: 200,
    densityFactor: 0.00018,     // more embers on large screens
    sizeMin: 1.2,
    sizeMax: 3.2,
    vx: [-0.25, 0.25],          // lateral drift
    vy: [-0.90, -0.35],         // upward drift (negative = up)
    lifeMin: 3.5,
    lifeMax: 7.5,
    glowBlur: 22
  };

  let DPR = 1, W = 0, H = 0, last = 0, running = true;
  const particles = [];
  const rand = (a, b) => a + Math.random() * (b - a);

  function spawn() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(SETTINGS.sizeMin, SETTINGS.sizeMax),
      vx: rand(SETTINGS.vx[0], SETTINGS.vx[1]),
      vy: rand(SETTINGS.vy[0], SETTINGS.vy[1]),
      life: 0,
      lifeMax: rand(SETTINGS.lifeMin, SETTINGS.lifeMax),
      seed: Math.random() * 1000,
      freq: rand(1.2, 2.2)
    };
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, window.innerWidth  | 0);
    H = Math.max(1, window.innerHeight | 0);

    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const target = Math.round(SETTINGS.countBase + W * H * SETTINGS.densityFactor);
    if (particles.length > target) particles.length = target;
    while (particles.length < target) particles.push(spawn());
  }

  function step(dt) {
    // Clear each frame (no “sinking to bottom” issue)
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);

    // Draw additively for glow
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // recycle if out of bounds or expired
      p.life += dt;
      if (p.life > p.lifeMax || p.y < -16 || p.x < -16 || p.x > W + 16) {
        particles[i] = spawn();
        particles[i].y = H + Math.random() * 40; // respawn near bottom
        continue;
      }

      // motion
      p.x += p.vx;
      p.y += p.vy;

      // gentle flicker
      const t = p.life * p.freq + p.seed;
      const base = 0.70 + 0.30 * Math.sin(t * 6.283 + Math.sin(t * 2.7) * 0.7);

      const r   = p.r * (0.9 + 0.35 * base);
      const blur = SETTINGS.glowBlur * (0.7 + 0.6 * base);

      // warm color ramp (center hot → fade)
      const hot = 0.90 * base;
      const mid = 0.55 * base;

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
      grad.addColorStop(0.00, `rgba(255,230,160,${hot})`);
      grad.addColorStop(0.35, `rgba(255,170,70,${mid})`);
      grad.addColorStop(1.00, `rgba(120,20,0,0)`);

      ctx.save();
      ctx.shadowBlur  = blur;
      ctx.shadowColor = `rgba(255,120,30,${0.5 * base})`;
      ctx.fillStyle   = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    step(dt);
    requestAnimationFrame(loop);
  }

  // init
  resize();
  addEventListener('resize', resize, { passive: true });

  // make sure canvas sits behind content
  Object.assign(canvas.style, {
    position: 'fixed',
    inset: '0',
    zIndex: '10',
    pointerEvents: 'none',
    display: 'block',
    background: 'transparent'
  });

  document.addEventListener('visibilitychange', () => {
    const was = running;
    running = !document.hidden;
    if (running && !was) { last = 0; requestAnimationFrame(loop); }
  }, { passive: true });

  requestAnimationFrame(loop);
})();

/* ===== Sticky nav tighten on scroll =================================== */
(() => {
  const nav = document.getElementById('site-nav') || document.querySelector('nav');
  if (!nav) return;
  const setSticky = () => nav.classList.toggle('nav--scrolled', window.scrollY > 10);
  setSticky();
  addEventListener('scroll', setSticky, { passive: true });
})();
</script>
